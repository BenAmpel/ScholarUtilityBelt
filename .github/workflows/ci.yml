name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: node build.js
      # The built extension in Microsoft Edge (preinstalled on GitHub's Ubuntu runners) against local Scholar-shaped
      # fixtures; every Scholar URL is answered locally and other requests are blocked.
      - name: End-to-end (offline fixtures, Edge)
        run: |
          EDGE="$(command -v microsoft-edge || command -v microsoft-edge-stable || true)"
          if [ -z "$EDGE" ]; then echo "Microsoft Edge not on this runner; skipping e2e"; exit 0; fi
          EDGE_PATH="$EDGE" npm run e2e
      - name: Accessibility (axe-core, light and dark)
        run: |
          EDGE="$(command -v microsoft-edge || command -v microsoft-edge-stable || true)"
          if [ -z "$EDGE" ]; then echo "Microsoft Edge not on this runner; skipping a11y"; exit 0; fi
          EDGE_PATH="$EDGE" npm run a11y
      - name: A theme switch repaints the open Scholar page and survives a reload
        run: |
          EDGE="$(command -v microsoft-edge || command -v microsoft-edge-stable || true)"
          if [ -z "$EDGE" ]; then echo "Microsoft Edge not on this runner; skipping theme check"; exit 0; fi
          EDGE_PATH="$EDGE" npm run theme
      - name: Keyboard focus is visible on every extension control
        run: |
          EDGE="$(command -v microsoft-edge || command -v microsoft-edge-stable || true)"
          if [ -z "$EDGE" ]; then echo "Microsoft Edge not on this runner; skipping focus check"; exit 0; fi
          EDGE_PATH="$EDGE" npm run focus
      - name: An idle Scholar tab does not keep the CPU busy
        run: |
          EDGE="$(command -v microsoft-edge || command -v microsoft-edge-stable || true)"
          if [ -z "$EDGE" ]; then echo "Microsoft Edge not on this runner; skipping idle check"; exit 0; fi
          EDGE_PATH="$EDGE" npm run idle
      - name: Package all stores, then end-to-end on the Edge package
        run: |
          EDGE="$(command -v microsoft-edge || command -v microsoft-edge-stable || true)"
          bash scripts/package_release.sh
          if [ -z "$EDGE" ]; then echo "Microsoft Edge not on this runner; skipping"; exit 0; fi
          EDGE_PATH="$EDGE" EXT_DIR=output/variants/edge npm run e2e
