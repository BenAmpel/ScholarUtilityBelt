<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scholar Utility Belt</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="title">Scholar Utility Belt</div>
      <div class="subtitle">Local-only · <span id="savedCount">—</span> saved papers</div>
    </header>

    <main>
      <section class="rating-card" id="ratingCard" hidden aria-labelledby="ratingTitle">
        <div class="rating-title" id="ratingTitle">Rate Scholar Utility Belt?</div>
        <p class="rating-sub">Ratings help other researchers decide whether to try it. The link opens the store's review page.</p>
        <div class="rating-actions"><a id="ratingLink" class="rating-link" href="https://chromewebstore.google.com/detail/scholar-utility-belt/omcogfcgldfmihfogbffflbocdbjockn/reviews" target="_blank" rel="noopener noreferrer">Rate it</a> <button type="button" id="ratingLater" class="rating-text-btn">Not now</button> <button type="button" id="ratingNever" class="rating-text-btn">Don't ask again</button></div>
      </section>

      <div class="buttons">
        <button id="openLibrary">Open Library</button>
        <button id="openOptions">Options</button>
      </div>

      <section class="quick-settings">
        <div class="section-label">Quick Settings</div>
        <label class="toggle-row">
          <span class="toggle-label">Quality badges</span>
          <input type="checkbox" id="showQualityBadges" class="toggle-input" />
          <span class="toggle-switch"></span>
        </label>
        <label class="toggle-row">
          <span class="toggle-label">Emerging score</span>
          <input type="checkbox" id="showEmergingScore" class="toggle-input" />
          <span class="toggle-switch"></span>
        </label>
        <label class="toggle-row">
          <span class="toggle-label">Retraction watch</span>
          <input type="checkbox" id="showRetractionWatch" class="toggle-input" />
          <span class="toggle-switch"></span>
        </label>
        <label class="toggle-row">
          <span class="toggle-label">Hover summary</span>
          <input type="checkbox" id="showHoverSummary" class="toggle-input" />
          <span class="toggle-switch"></span>
        </label>
        <label class="toggle-row">
          <span class="toggle-label">Reading guide</span>
          <input type="checkbox" id="showReadingGuide" class="toggle-input" />
          <span class="toggle-switch"></span>
        </label>
      </section>

      <hr />

      <div class="buttons">
        <button id="exportJson">Export JSON</button>
        <label class="fileLabel">
          Import JSON
          <input id="importJson" type="file" accept="application/json" />
        </label>
      </div>

      <div class="hint" id="hint"></div>
    </main>

    <script type="module" src="../../dist/popup/popup.js"></script>
  </body>
</html>
