<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scholar Utility Belt</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="title">Scholar Utility Belt</div>
      <div class="subtitle">Local-only · <span id="savedCount">—</span> saved papers</div>
    </header>

    <main>
      <div class="buttons">
        <button id="openLibrary">Open Library</button>
        <button id="openOptions">Options</button>
      </div>

      <section class="quick-settings">
        <div class="section-label">Quick Settings</div>
        <label class="toggle-row">
          <span class="toggle-label">Quality badges</span>
          <input type="checkbox" id="showQualityBadges" class="toggle-input" />
          <span class="toggle-switch"></span>
        </label>
        <label class="toggle-row">
          <span class="toggle-label">Emerging score</span>
          <input type="checkbox" id="showEmergingScore" class="toggle-input" />
          <span class="toggle-switch"></span>
        </label>
        <label class="toggle-row">
          <span class="toggle-label">Retraction watch</span>
          <input type="checkbox" id="showRetractionWatch" class="toggle-input" />
          <span class="toggle-switch"></span>
        </label>
        <label class="toggle-row">
          <span class="toggle-label">Hover summary</span>
          <input type="checkbox" id="showHoverSummary" class="toggle-input" />
          <span class="toggle-switch"></span>
        </label>
        <label class="toggle-row">
          <span class="toggle-label">Reading guide</span>
          <input type="checkbox" id="showReadingGuide" class="toggle-input" />
          <span class="toggle-switch"></span>
        </label>
      </section>

      <hr />

      <div class="buttons">
        <button id="exportJson">Export JSON</button>
        <label class="fileLabel">
          Import JSON
          <input id="importJson" type="file" accept="application/json" />
        </label>
      </div>

      <div class="hint" id="hint"></div>
    </main>

    <script type="module" src="../../dist/popup/popup.js"></script>
  </body>
</html>
